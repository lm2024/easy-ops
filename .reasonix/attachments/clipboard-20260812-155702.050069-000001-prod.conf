# ============================================================
# EasyOps Nginx 生产配置
# 标注了所有需要修改的地方，搜索 "【改】" 即可找到
# ============================================================

# 【改】worker 数量：auto 自动匹配 CPU 核数，或手动写核心数（如 4）
worker_processes auto;

events {
    # 【改】每个 worker 最大连接数，生产建议 4096+
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ====== 生产增强：Gzip 压缩 ======
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_vary on;

    # ====== 生产增强：限流（防 DDoS/CC 攻击）======
    # 每个 IP 每秒 20 个请求，突发允许 40 个排队
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/s;

    # ====== 日志格式 ======
    # 引号格式（旧，兼容）：字段按位置取值
    log_format main
        '"$time_iso8601"'
        '"$remote_addr"'
        '"$http_x_forwarded_for"'
        '"$remote_user"'
        '"$request"'
        '"$status"'
        '"$body_bytes_sent"'
        '"$http_referer"'
        '"$http_user_agent"'
        '"$upstream_addr"'
        '"$request_time"'
        '"$upstream_response_time"'
        '"$http_host"';

    # JSON 格式（推荐）：字段带名，新增字段不破坏解析
    log_format easyops_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"xff":"$http_x_forwarded_for",'
        '"remote_user":"$remote_user",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"host":"$http_host",'
        '"upstream_status":"$upstream_status",'
        '"upstream_connect_time":$upstream_connect_time,'
        '"upstream_header_time":$upstream_header_time,'
        '"request_length":$request_length,'
        '"cache_status":"$upstream_cache_status",'
        '"scheme":"$scheme",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher",'
        '"msec":$msec'
        '}';

    # 【改】日志路径：生产环境保持 /var/log/nginx/ 即可
    access_log /var/log/nginx/access.log easyops_json;

    # ====== 上游 Server 配置 ======
    upstream easyops_server {
        # 【改】生产环境填 Server 机器的真实 IP 或域名
        # 如果 Server 和 Nginx 在同一台机器，用 127.0.0.1:8081
        # 如果分开部署，填 Server 机器 IP，如 192.168.1.100:8081
        server 127.0.0.1:8081;

        # 生产增强：长连接复用，减少 TCP 握手开销
        keepalive 32;
    }

    # ====== Server 配置 ======
    server {
        # 【改】HTTP 端口，如果要跳转 HTTPS 就这里改为 80
        listen 80;

        # 【改】生产域名，如 easyops.yourcompany.com
        # 有多个域名用空格分隔：easyops.example.com www.example.com
        server_name localhost;

        # 【改】前端 dist 目录的实际路径
        # Docker 内一般在 /usr/share/nginx/html
        # 裸机部署改为实际路径，如 /opt/easyops/frontend/dist
        root /usr/share/nginx/html;
        index index.html;

        # ====== API 反向代理 ======
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass http://easyops_server/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 生产增强：代理超时
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # ====== WebSocket 反向代理 ======
        location /ws/ {
            limit_req zone=ws_limit burst=10 nodelay;

            proxy_pass http://easyops_server/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # WebSocket 超时：默认 60s，终端/部署需要更长
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ====== 前端路由（SPA）======
        location / {
            try_files $uri $uri/ /index.html;

            # 生产增强：静态资源缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 7d;
                add_header Cache-Control "public, no-transform";
            }
        }

        # ====== 生产增强：安全头 ======
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # ============================================================
    # 【改】如果要用 HTTPS，取消下面注释并配置证书路径
    # ============================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name easyops.yourcompany.com;
    #     root /usr/share/nginx/html;
    #     index index.html;
    #
    #     # 【改】SSL 证书路径
    #     ssl_certificate     /etc/nginx/ssl/easyops.pem;
    #     ssl_certificate_key /etc/nginx/ssl/easyops.key;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # 同上面的 location 配置...
    #     location /api/ {
    #         proxy_pass http://easyops_server/api/;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #     }
    #
    #     location /ws/ {
    #         proxy_pass http://easyops_server/ws/;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_read_timeout 3600s;
    #         proxy_send_timeout 3600s;
    #     }
    #
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    # }
