worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 引号格式（旧，兼容）：字段按位置取值，新增字段必须追加在末尾
    log_format main
        '"$time_iso8601"'
        '"$remote_addr"'
        '"$http_x_forwarded_for"'
        '"$remote_user"'
        '"$request"'
        '"$status"'
        '"$body_bytes_sent"'
        '"$http_referer"'
        '"$http_user_agent"'
        '"$upstream_addr"'
        '"$request_time"'
        '"$upstream_response_time"'
        '"$http_host"';

    # JSON 格式（推荐）：字段带名，新增字段不破坏解析
    log_format easyops_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"xff":"$http_x_forwarded_for",'
        '"remote_user":"$remote_user",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"host":"$http_host",'
        '"upstream_status":"$upstream_status",'
        '"upstream_connect_time":$upstream_connect_time,'
        '"upstream_header_time":$upstream_header_time,'
        '"request_length":$request_length,'
        '"cache_status":"$upstream_cache_status",'
        '"scheme":"$scheme",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher",'
        '"msec":$msec'
        '}';

    access_log /var/log/nginx/access.log easyops_json;

    upstream easyops_server {
        server host.docker.internal:8081;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://easyops_server/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://easyops_server/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
