# =============================================================================
# EasyOps Agent 配置
# =============================================================================
# 生产部署：直接用 scripts/start.sh 启动，无需修改本文件
# 所有生产配置通过环境变量或 start.sh 顶部的变量覆盖
# =============================================================================

server:
  port: ${AGENT_PORT:2123}
  servlet:
    context-path: /api

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# Agent 核心配置（start.sh 会自动 export 这些环境变量）
agent:
  # 【必须】Server API 地址，如 http://192.168.1.10:8081/api
  server-url: ${AGENT_SERVER_URL:http://localhost:8081/api}
  # 【必须】节点 Token（任意非空字符串，Server 按此自动注册节点）
  token: ${AGENT_TOKEN:}
  # 【必须】节点名称（在 Server 节点列表中显示）
  node-name: ${AGENT_NODE_NAME:default-node}
  # Agent 本地数据目录（版本包、日志、pid 等）
  data-path: ${AGENT_DATA_PATH:/app/data}
  version: ${AGENT_VERSION:1.0.0-SNAPSHOT}
  jar-path: ${AGENT_JAR_PATH:/app/agent.jar}
  # 重启模式：auto=自动检测；shell=裸机；docker=容器
  restart-mode: ${AGENT_RESTART_MODE:auto}
  restart-script: ${AGENT_RESTART_SCRIPT:}
  java-bin: ${AGENT_JAVA_BIN:}
  check-interval: 60
  # 上报给 Server 的外部 IP（多网卡时填写，留空则自动检测；本地调试/Docker 环境填 127.0.0.1）
  host-ip: ${AGENT_HOST_IP:127.0.0.1}
  # 上报给 Server 的外部端口（留空或 0 则用 server.port）
  host-port: ${AGENT_HOST_PORT:0}
  # Nginx 日志采集配置
  nginx-traffic:
    # 日志源刷新频率（毫秒）—— Agent 启动后 5 秒首次执行，之后每隔此间隔向 Server 拉取最新日志源列表（哪些节点、哪些路径、是否启用）。
    refresh-sources-interval: 30000
    # 日志采集频率（毫秒）—— 每 N 秒从 Nginx access.log 增量读取新行 → 正则解析 → 分钟级聚合 → 上报 Server。
    # 注意：此值越小，Agent CPU/磁盘 I/O 越高；生产环境建议 5000~10000 毫秒（低频、低流量环境可设更大）。
    collect-tick-interval: 5000
    # 定时器刷新频率（毫秒）—— 每 N 秒强制将当前分钟的聚合数据上报到 Server，同时将桶滚转到下一分钟。
    # 这是兜底机制：如果 collectTick 聚合的分钟还没到边界，flushTick 保证数据最终上报。
    flush-tick-interval: 60000

logging:
  level:
    com.ops.agent: INFO
  file:
    name: ${AGENT_DATA_PATH:/app/data}/logs/agent.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 30MB
