# =============================================================================
# EasyOps Server 配置
# =============================================================================
# 生产部署：直接用 scripts/start.sh 启动，无需修改本文件
# 所有生产配置通过环境变量或 start.sh 顶部的变量覆盖
# =============================================================================

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api
    encoding:
      enabled: true
      charset: UTF-8
      force: true
  max-http-request-size: 10MB
  max-http-response-size: 10MB
  tomcat:
    max-swallow-size: 10MB
    accesslog:
      enabled: true
      pattern: '%h %l %u %t "%r" %s %b'
  # 数据根目录（H2、版本包、日志），start.sh 通过 -Dserver.path 覆盖
  path: ${EASYOPS_SERVER_DATA:./data}
  heart-second: 5
  offline-second: 90

spring:
  application:
    name: ops-server
  profiles:
    active: dev
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${EASYOPS_SERVER_DATA:./data}/ops;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# JWT：仅启动校验用，实际 token 由 SecureRandom 生成，非标准 JWT
# 生产：在 start.sh 中修改 JWT_SECRET 变量
jwt:
  secret: ${JWT_SECRET:easyops-dev-secret-key-for-local-development-only-2026}
  expire-ms: 86400000

# 默认管理员密码 —— 唯一配置源，改这个值即可（重启生效）
# 优先级：YML 配置 > 用户自己设置的密码（每次启动都会用 YML 密码覆盖）
app:
  admin:
    default-password: Password01!


mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: INFO
    com.ops.server: DEBUG
    # mapper DEBUG 会打印全部 SQL，生产建议 WARN；排查 SQL 问题时临时改为 DEBUG
    com.ops.server.mapper: WARN
    # 调度器分布式锁日志过于频繁，降为 INFO
    com.ops.server.scheduler: INFO
  file:
    name: ${EASYOPS_SERVER_DATA:./data}/logs/server.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 50MB

# CORS：内网默认放行；生产可收紧为具体前端域名
cors:
  allowed-origins: "*"

# AI 分析（可选）
ai:
  apiKey: ${AI_API_KEY:}

websocket:
  max-connections: 1000

# Agent 路径配置（Server 计算 Agent 侧路径时使用）
ops:
  global:
    agent-data-path: ${AGENT_DATA_PATH:/app/data}
    deploy-base-dir: ${OPS_DEPLOY_BASE_DIR:/app/data/apps}
    log-sub-dir: logs
    config-sub-dir: config
    frontend-sub-dir: frontend

# =============================================================================
# 白名单自动登录（调试 / 自动化专用）
# 默认全部关闭：不启用、且不配置白名单 key 时，该接口等同于不存在，外网无法利用。
# 仅需自动化/agent 登录时，把 AUTO_LOGIN_ENABLED 置 true 并下发 AUTO_LOGIN_WHITELIST 即可。
# 调用：POST /api/auth/auto-login  { "key": "..." } 或请求头 X-Auto-Login-Key
# 配置并入下方已有的 easyops 根节点（auth 与 data / nginx-traffic 同级）
# =============================================================================

# =============================================================================
# 数据清理配置（定时删除过期流水数据，防止 H2 数据库膨胀）
# =============================================================================
# 所有高频流水表统一在此管理，新增表只需加一行配置即可。
# 清理策略：
#   - 普通流水表：按 create_time 删除超过 retain-days 天的记录
#   - notification_record：按 expire_time 删除已过期通知
#   - user_notification_state：级联删除通知已不存在的孤儿记录
#   - kb_document_lock / scheduler_lock：删除已过期的锁
# =============================================================================
easyops:
  data:
    cleanup:
      # 每日清理执行时间（Quartz cron 表达式），默认凌晨 2:00
      cron: "0 0 2 * * ?"
      # 默认保留天数（最小 1 天），应用到所有按 create_time 清理的表
      retain-days: 3
      # 清理后自动重启 server（回收 H2 空洞空间：H2 在数据库关闭时自动压缩）。
      # ⚠️ 前提：进程退出后必须由外部守护（systemd / docker --restart / 守护脚本）自动拉起，
      #    否则服务会停止。默认 false 关闭。
      auto-restart: false
      # 磁盘使用率超过该值（%）时，清理完成后触发自动重启
      restart-threshold-pct: 80
      # 按表单独覆盖保留天数（可选），key 为表名（小写），value 为保留天数。
      # 注意：nginx_* 统计/采样表不在此配置，统一走下方 nginx-traffic.minute-retain-days。
      table-retain-days:
        operation_log: 3
        file_access_log: 3
        monitor_snapshot: 3
        alarm_record: 3
        self_heal_event: 3
        deploy_record: 3
        config_distribute_record: 3
        ai_diagnosis_record: 3
        kb_recent_access: 3
        agent_upgrade_record: 3
        global_script_distribute_record: 3
        script_distribute_record: 3


  # =============================================================================
  # 表元数据（表分类/识别/清空策略的单一事实来源）
  # 前端 DbManage 与 /db/* 接口全部基于此渲染，新增表只需在此加一行。
  # type 取值：
  #   BASE      基础数据表（用户/节点/项目/租户/配置...），禁止清空
  #   CONFIG    配置/状态表（探针/锁/策略...），禁止清空
  #   FLOW      流水表（日志/统计/记录...），可一键清空
  #   AGENT_SYNC agent 同步上报表（快照/上报数据...），可一键清空
  # source 可选：标记数据来源（agent/nginx/script/kb...）
  # =============================================================================
    table-meta:
      categories:
        node:     { label: "节点管理",   icon: "🖥️" }
        project:  { label: "项目部署",   icon: "🚀" }
        alarm:    { label: "告警管理",   icon: "🔔" }
        user:     { label: "用户权限",   icon: "👤" }
        audit:    { label: "审计日志",   icon: "📋" }
        sys:      { label: "系统配置",   icon: "⚙️" }
        config:   { label: "配置管理",   icon: "📁" }
        log:      { label: "日志管理",   icon: "📝" }
        monitor:  { label: "监控诊断",   icon: "📊" }
        kb:       { label: "知识库",     icon: "📚" }
        heal:     { label: "自愈通知",   icon: "🔧" }
        nginx:    { label: "Nginx 流量", icon: "🌐" }
        script:   { label: "脚本分发",   icon: "🧩" }
        tenant:   { label: "租户管理",   icon: "🏢" }
      tables:
        # ---- 租户管理 ----
        tenant:               { label: "租户",             category: tenant,  type: BASE }
        tenant_user:          { label: "租户用户",         category: tenant,  type: BASE }
        # ---- 用户权限 ----
        sys_user:             { label: "系统用户",         category: user,    type: BASE }
        user_project_relation: { label: "用户项目关系",     category: user,    type: BASE }
        # ---- 节点管理 ----
        node_info:            { label: "节点信息",         category: node,    type: BASE }
        agent_upgrade_record: { label: "Agent 升级记录",   category: node,    type: FLOW }
        node_transfer_application: { label: "节点传输应用", category: node,    type: AGENT_SYNC, source: agent }
        # ---- 项目部署 ----
        project_info:         { label: "项目信息",         category: project, type: BASE }
        version_package:      { label: "版本包",           category: project, type: BASE }
        deploy_record:        { label: "部署记录",         category: project, type: FLOW }
        # ---- 告警管理 ----
        alarm_config:         { label: "告警配置",         category: alarm,   type: BASE }
        alarm_record:         { label: "告警记录",         category: alarm,   type: FLOW }
        # ---- 审计日志 ----
        operation_log:        { label: "操作日志",         category: audit,   type: FLOW }
        file_access_log:      { label: "文件访问日志",     category: audit,   type: FLOW }
        # ---- 系统配置 ----
        sys_config:           { label: "系统配置",         category: sys,     type: BASE }
        scheduler_lock:       { label: "调度锁",           category: sys,     type: CONFIG }
        # ---- 配置管理 ----
        project_config_file:  { label: "项目配置文件",     category: config,  type: BASE }
        node_config_snapshot: { label: "节点配置快照",     category: config,  type: AGENT_SYNC, source: agent }
        config_distribute_record: { label: "配置分发记录", category: config,  type: FLOW }
        # ---- 日志管理 ----
        project_log_profile:  { label: "日志配置",         category: log,     type: BASE }
        # ---- 监控诊断 ----
        project_health_probe: { label: "健康探针",         category: monitor, type: BASE }
        monitor_snapshot:     { label: "监控快照",         category: monitor, type: FLOW, source: agent }
        ai_diagnosis_record:  { label: "AI 诊断记录",      category: monitor, type: FLOW }
        # ---- 知识库 ----
        kb_category:          { label: "知识分类",         category: kb,      type: BASE }
        kb_document:          { label: "知识文档",         category: kb,      type: BASE }
        kb_document_version:  { label: "文档版本",         category: kb,      type: BASE }
        kb_comment:           { label: "文档评论",         category: kb,      type: BASE }
        kb_document_lock:     { label: "文档锁",           category: kb,      type: CONFIG }
        kb_image:             { label: "知识库图片",       category: kb,      type: BASE }
        kb_tag:               { label: "知识标签",         category: kb,      type: BASE }
        kb_document_tag:      { label: "文档标签关联",     category: kb,      type: BASE }
        kb_document_permission: { label: "文档权限",       category: kb,      type: BASE }
        kb_template:          { label: "知识模板",         category: kb,      type: BASE }
        kb_favorite:          { label: "知识收藏",         category: kb,      type: FLOW }
        kb_recent_access:     { label: "最近访问",         category: kb,      type: FLOW }
        kb_share_link:        { label: "分享链接",         category: kb,      type: FLOW }
        # ---- 自愈通知 ----
        self_heal_policy:     { label: "自愈策略",         category: heal,    type: BASE }
        self_heal_event:      { label: "自愈事件",         category: heal,    type: FLOW }
        notification_record:  { label: "通知记录",         category: heal,    type: FLOW }
        user_notification_state: { label: "用户通知状态",  category: heal,    type: FLOW }
        # ---- Nginx 流量 ----
        nginx_access_source:  { label: "访问源",           category: nginx,   type: BASE }
        nginx_source_whitelist: { label: "白名单",         category: nginx,   type: BASE }
        nginx_traffic_alarm_rule: { label: "流量告警规则", category: nginx,   type: BASE }
        nginx_minute_stat:    { label: "分钟统计",         category: nginx,   type: FLOW, source: nginx }
        nginx_ip_stat:        { label: "IP 统计",          category: nginx,   type: FLOW, source: nginx }
        nginx_ua_stat:        { label: "UA 统计",          category: nginx,   type: FLOW, source: nginx }
        nginx_referer_stat:   { label: "来源统计",         category: nginx,   type: FLOW, source: nginx }
        nginx_request_sample: { label: "请求采样",         category: nginx,   type: FLOW, source: nginx }
        # ---- 脚本分发 ----
        global_script_file:   { label: "全局脚本文件",     category: script,  type: BASE }
        global_script_snapshot: { label: "全局脚本快照",   category: script,  type: FLOW }
        global_script_distribute_record: { label: "全局脚本分发记录", category: script, type: FLOW }
        project_script_file:  { label: "项目脚本文件",     category: script,  type: BASE }
        node_script_snapshot: { label: "节点脚本快照",     category: script,  type: AGENT_SYNC, source: agent }
        script_distribute_record: { label: "脚本分发记录", category: script,  type: FLOW }
  nginx-traffic:
    minute-retain-days: 2


  auth:
    auto-login-enabled: ${AUTO_LOGIN_ENABLED:false}
    auto-login-username: ${AUTO_LOGIN_USERNAME:admin}
    # 逗号分隔的 key 白名单；命中其一即放行。建议用随机长字符串。
    auto-login-whitelist: ${AUTO_LOGIN_WHITELIST:}
